<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>樂園即時看板 · 迪士尼／環球影城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#F5F1E6;
    --panel:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B5847;
    --navy:#16233B;
    --navy-soft:#223252;
    --gold:#E4A335;
    --gold-soft:#F3D9A8;
    --green:#2F6B4F;
    --green-bg:#E4EFE7;
    --red:#B23A2E;
    --red-bg:#F5E3E0;
    --amber:#C97A22;
    --amber-bg:#F5E7D2;
    --gray:#8A8570;
    --gray-bg:#EAE5D5;
    --line:#DCD3BC;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:.9;
  }
  h1,h2,h3{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.01em;
    margin:0;
  }

  /* ---- Marquee header ---- */
  header.marquee{
    background:var(--navy);
    color:#F5F1E6;
    padding:22px 18px 20px;
    position:relative;
    overflow:hidden;
    border-bottom:3px solid var(--gold);
  }
  header.marquee::before{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(circle, rgba(228,163,53,.55) 1.4px, transparent 1.4px);
    background-size:16px 16px;
    opacity:.12;
    pointer-events:none;
  }
  .marquee-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1;}
  header.marquee h1{
    font-size:20px;
    text-transform:uppercase;
    letter-spacing:.03em;
    line-height:1.25;
  }
  header.marquee h1 span{color:var(--gold);}
  .clock{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--gold-soft);
    text-align:right;
    white-space:nowrap;
  }
  .sub-eyebrow{margin-top:6px;font-size:12px;color:#C8CBD8;font-family:'Inter';letter-spacing:.02em;position:relative;z-index:1;}

  main{max-width:820px;margin:0 auto;padding:0 14px;}

  /* ---- Picker ---- */
  .picker{padding-top:18px;}
  .picker-group{margin-bottom:16px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .chip{
    border:1.5px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    padding:9px 14px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    transition:.15s;
    font-family:'Inter';
  }
  .chip:hover{border-color:var(--gold);}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .searchbox{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--panel);
    font-size:14px;
    font-family:'Inter';
    margin-top:10px;
  }
  .searchbox:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .search-wrap{position:relative;}
  .search-wrap .searchbox{padding-right:38px;}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border-radius:50%;border:none;background:var(--gray-bg);
    color:var(--ink-soft);font-size:13px;cursor:pointer;line-height:1;
  }
  .quick-results{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .quick-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel);border:1.5px solid var(--gold-soft);border-radius:10px;
    padding:10px 12px;cursor:pointer;text-align:left;
  }
  .quick-item:hover{border-color:var(--gold);}
  .quick-item .qi-name{font-size:13.5px;font-weight:600;color:var(--navy);}
  .quick-item .qi-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .quick-item .qi-go{font-family:'IBM Plex Mono';font-size:11px;color:var(--gold);white-space:nowrap;}
  .quick-empty{font-size:12.5px;color:var(--ink-soft);padding:8px 2px;}

  /* ---- Park tabs ---- */
  .park-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 6px;}
  .park-tab{
    padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--panel);cursor:pointer;font-size:13.5px;font-weight:600;
    font-family:'Oswald';letter-spacing:.02em;color:var(--navy);
  }
  .park-tab.active{background:var(--gold);border-color:var(--gold);color:var(--navy);}

  /* ---- Ticket stub header ---- */
  .stub{
    background:var(--panel);
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    margin-top:8px;
    padding:18px;
    position:relative;
    box-shadow:0 1px 0 var(--line);
  }
  .stub-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .stub h2{font-size:19px;color:var(--navy);}
  .status-pill{
    font-family:'IBM Plex Mono';font-size:11.5px;font-weight:600;
    padding:5px 10px;border-radius:999px;white-space:nowrap;letter-spacing:.03em;
  }
  .status-OPERATING,.status-open{background:var(--green-bg);color:var(--green);}
  .status-CLOSED,.status-closed{background:var(--gray-bg);color:var(--gray);}
  .status-DOWN{background:var(--red-bg);color:var(--red);}
  .status-REFURBISHMENT{background:var(--amber-bg);color:var(--amber);}
  .status-unknown{background:var(--gray-bg);color:var(--gray);}

  .hours-board{
    display:flex;align-items:center;gap:14px;margin-top:14px;
    border-top:1px dashed var(--line);padding-top:14px;
  }
  .hours-time{
    font-family:'IBM Plex Mono';font-weight:700;font-size:26px;
    background:var(--navy);color:var(--gold-soft);
    padding:6px 10px;border-radius:6px;letter-spacing:.02em;
  }
  .hours-arrow{color:var(--ink-soft);font-size:18px;}
  .hours-label{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono';letter-spacing:.05em;text-transform:uppercase;margin-top:4px;}

  /* ---- View toggle ---- */
  .view-toggle{display:flex;gap:6px;margin:16px 0 10px;}
  .view-btn{
    flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--panel);font-family:'Oswald';font-size:13px;font-weight:600;
    letter-spacing:.03em;cursor:pointer;color:var(--ink-soft);
  }
  .view-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .controls-row{display:flex;gap:8px;margin-bottom:10px;}
  .controls-row .searchbox{margin-top:0;flex:1;}
  .sort-btn{
    border:1.5px solid var(--line);background:var(--panel);border-radius:10px;
    padding:0 12px;font-family:'IBM Plex Mono';font-size:12px;cursor:pointer;color:var(--ink);
  }
  .lang-toggle{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .lang-label{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono';letter-spacing:.04em;margin-right:2px;}
  .lang-btn{
    border:1.5px solid var(--line);background:var(--panel);border-radius:999px;
    padding:5px 11px;font-family:'Inter';font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);
  }
  .lang-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .name-en{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);margin-top:2px;}
  .auto-tag{
    display:inline-block;font-size:9px;font-weight:600;color:var(--amber);
    background:var(--amber-bg);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle;
  }
  .translating{opacity:.65;}

  /* ---- Section ---- */
  .section-title{
    display:flex;align-items:center;gap:8px;margin:18px 0 8px;
  }
  .section-title h3{font-size:15px;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;}
  .section-count{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);}

  .card-list{display:flex;flex-direction:column;gap:8px;}
  .item-row{
    background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;
    scroll-margin-top:16px;
  }
  .item-row.highlight{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft);}
  .item-main{flex:1;min-width:0;}
  .item-name{font-size:14.5px;font-weight:600;color:var(--ink);}
  .item-meta{display:flex;align-items:center;gap:6px;margin-top:4px;}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .dot-OPERATING{background:var(--green);}
  .dot-CLOSED{background:var(--gray);}
  .dot-DOWN{background:var(--red);}
  .dot-REFURBISHMENT{background:var(--amber);}
  .dot-unknown{background:var(--gray);}
  .item-status-text{font-size:12px;color:var(--ink-soft);}

  .flap{
    font-family:'IBM Plex Mono';font-weight:700;font-size:17px;
    background:var(--navy);color:var(--gold-soft);
    border-radius:6px;padding:7px 10px;min-width:56px;text-align:center;
    transition:transform .25s;
  }
  .flap.pulse{animation:flip .4s;}
  @keyframes flip{
    0%{transform:rotateX(90deg);opacity:.3;}
    100%{transform:rotateX(0deg);opacity:1;}
  }
  .flap-sub{font-size:9px;font-weight:500;letter-spacing:.04em;opacity:.75;display:block;margin-top:1px;}

  .showtimes{display:flex;flex-wrap:wrap;gap:5px;max-width:150px;justify-content:flex-end;}
  .showtime-chip{
    font-family:'IBM Plex Mono';font-size:11px;background:var(--gold-soft);
    color:var(--navy);padding:3px 7px;border-radius:6px;font-weight:600;
  }

  /* ---- Map ---- */
  .map-wrap{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px;}
  .map-note{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;line-height:1.5;}
  #leafletMap{width:100%;height:440px;border-radius:10px;border:1px solid var(--line);background:#eee;}
  .leaflet-popup-content{font-family:'Inter';font-size:13px;line-height:1.5;}
  .popup-title{font-weight:700;color:var(--navy);margin-bottom:2px;}
  .popup-btn-row{display:flex;gap:6px;margin-top:6px;}
  .popup-btn{
    border:none;background:var(--navy);color:#fff;border-radius:6px;padding:5px 9px;
    font-size:11.5px;font-weight:600;cursor:pointer;font-family:'Inter';
  }
  .you-are-here-dot{
    width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;
    box-shadow:0 0 0 5px rgba(26,115,232,.35);
  }
  .map-controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .map-ctrl-btn{
    border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;
    font-family:'Inter';font-weight:600;font-size:12.5px;cursor:pointer;color:var(--navy);
  }
  .route-info{margin-top:8px;font-size:12.5px;color:var(--navy);background:var(--gold-soft);padding:8px 10px;border-radius:8px;min-height:0;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-soft);}
  .legend-item{display:flex;align-items:center;gap:5px;}
  .legend-swatch{width:10px;height:10px;border-radius:50%;}

  .empty,.loading,.error-box{
    text-align:center;padding:30px 16px;color:var(--ink-soft);font-size:13.5px;
  }
  .error-box{background:var(--red-bg);color:var(--red);border-radius:12px;}
  .retry-btn{
    margin-top:10px;background:var(--navy);color:#fff;border:none;
    padding:9px 16px;border-radius:8px;font-family:'Inter';font-weight:600;font-size:13px;cursor:pointer;
  }
  .spinner{
    width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);
    border-radius:50%;margin:0 auto 10px;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .refresh-bar{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11.5px;color:var(--ink-soft);margin-top:14px;font-family:'IBM Plex Mono';
  }
  .refresh-btn{
    background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;
    font-family:'IBM Plex Mono';font-size:11px;cursor:pointer;color:var(--ink);
  }
  footer{max-width:820px;margin:26px auto 0;padding:14px 14px 0;border-top:1px solid var(--line);
    font-size:11px;color:var(--ink-soft);line-height:1.6;}
  a{color:var(--navy);}
  ::selection{background:var(--gold-soft);}
</style>
</head>
<body>

<header class="marquee">
  <div class="marquee-top">
    <h1>樂園即時看板<br><span>DISNEY · UNIVERSAL LIVE</span></h1>
    <div class="clock" id="clock">--:--:--</div>
  </div>
  <div class="sub-eyebrow">全球迪士尼樂園與環球影城 · 開關園時間、營運狀態、遊樂設施等待時間、演出時間</div>
</header>

<main>
  <div class="picker" id="picker">
    <div class="search-wrap">
      <input class="searchbox" id="destSearch" placeholder="搜尋樂園或渡假區（例如：東京、奧蘭多、Epcot、大阪…）" autocomplete="off" />
      <button class="search-clear" id="destSearchClear" style="display:none;" aria-label="清除搜尋">✕</button>
    </div>
    <div id="quickResults"></div>
    <div class="picker-group">
      <div class="eyebrow" style="color:var(--navy);">DISNEY 迪士尼</div>
      <div class="chip-row" id="disneyChips"></div>
    </div>
    <div class="picker-group">
      <div class="eyebrow" style="color:var(--navy);">UNIVERSAL 環球影城</div>
      <div class="chip-row" id="universalChips"></div>
    </div>
  </div>

  <div id="parkTabsWrap" style="display:none;">
    <div class="park-tabs" id="parkTabs"></div>
  </div>

  <div id="parkContent"></div>
</main>

<footer>
  資料來源：<a href="https://themeparks.wiki" target="_blank" rel="noopener">themeparks.wiki</a>（免費公開 API，涵蓋全球樂園即時排隊時間與營運資訊）。
  資料由樂園營運方即時提供，可能有延遲或缺漏；示意地圖為依官方座標自動生成之相對位置圖，非官方美術地圖。
  遊樂設施清單每 2 分鐘自動更新一次。
</footer>

    "kali river rapids":"卡莉河急流泛舟","dinosaur":"恐龍歷險記","it's tough to be a bug":"蟲蟲危機",

    "matterhorn bobsleds":"馬特洪山雪橇","indiana jones adventure":"印第安納瓊斯冒險",
    "radiator springs racers":"水鄉車行賽車","guardians of the galaxy mission breakout":"星際異攻隊：極速逃脫",

  const attrNameMap = {};
  Object.keys(attrNameRaw).forEach(k => { attrNameMap[k] = attrNameRaw[k]; });
  function attrZh(name){ return attrNameMap[normalizeAttr(name)] || null; }

  // Names not in the curated dictionary above are auto-translated on the fly via a free
  // machine-translation API and cached, so the full attraction list gets Chinese text —
  // clearly tagged "機器翻譯" since machine-translated ride names may not match official branding.
  const translateCache = {}; // normalized name -> translated string | null (pending)
  function queueTranslation(name, key, id){
    if(translateCache[key] !== undefined) return;
    translateCache[key] = null;
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(name)}&langpair=en|zh-TW`)
      .then(r=>r.json())
      .then(data=>{
        const t = data && data.responseData && data.responseData.translatedText;
        translateCache[key] = (t && t.trim() && t.trim().toLowerCase() !== name.toLowerCase()) ? t.trim() : name;
      })
      .catch(()=>{ translateCache[key] = name; })
      .finally(()=>{
        const el = id && document.getElementById("name_"+id);
        if(el) el.innerHTML = displayAttrName(name, id);
      });
  }

  function displayAttrName(name, id){
    if(nameLangMode === "en") return escapeHtml(name);
    const curated = attrZh(name);
    if(curated){
      return nameLangMode === "zh"
        ? escapeHtml(curated)
        : `${escapeHtml(curated)}<span class="name-en">${escapeHtml(name)}</span>`;
    }
    const key = normalizeAttr(name);
    const auto = translateCache[key];
    if(auto){
      const zhPart = `${escapeHtml(auto)}<span class="auto-tag">機器翻譯</span>`;
      return nameLangMode === "zh" ? zhPart : `${zhPart}<span class="name-en">${escapeHtml(name)}</span>`;
    }
    queueTranslation(name, key, id);
    return nameLangMode === "zh" ? `<span class="translating">${escapeHtml(name)}</span>` : escapeHtml(name);
  }
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---- State ----
  let destinations = [];
  let currentDest = null;
  let currentPark = null;
  let liveMap = {};      // id -> live entry
  let childrenMap = {};  // id -> child entity (for map coords / entityType)
  let prevWaits = {};    // id -> previous wait time (for flip animation)
  let currentView = "list";
  let sortMode = "default";
  let filterText = "";
  let nameLangMode = "both"; // "zh" | "en" | "both"
  let refreshTimer = null;
  // Leaflet map state
  let leafletMap = null;
  let leafletMapParkId = null;
  let leafletMarkers = {};   // entity id -> Leaflet marker
  let userLatLng = null;
  let userMarker = null;
  let routeLine = null;

  // ---- Clock ----
  function tickClock(){
    document.getElementById("clock").textContent = new Date().toLocaleTimeString('zh-TW',{hour12:false});
  }
  tickClock(); setInterval(tickClock, 1000);

  function isoTime(iso){
    if(!iso) return "--:--";
    const t = iso.split("T")[1];
    return t ? t.slice(0,5) : "--:--";
  }

  // ---- Fetch helpers ----
  // The themeparks.wiki API does not send CORS headers for all clients, so a direct
  // browser fetch can fail. Try direct first, then fall back to public CORS proxies.
  function fetchWithTimeout(url, ms){
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), ms);
    return fetch(url, {signal: ctrl.signal}).finally(()=>clearTimeout(t));
  }

  async function getJSON(url){
    const attempts = [
      url,
      "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
      "https://corsproxy.io/?url=" + encodeURIComponent(url),
    ];
    let lastErr;
    for(const attemptUrl of attempts){
      try{
        const res = await fetchWithTimeout(attemptUrl, 9000);
        if(!res.ok) throw new Error("HTTP "+res.status);
        return await res.json();
      }catch(err){
        lastErr = err;
      }
    }
    throw lastErr;
  }

  async function loadDestinations(){
    const wrap = document.getElementById("picker");
    document.getElementById("disneyChips").innerHTML = `<div class="loading"><div class="spinner"></div>正在讀取全球樂園清單…</div>`;
    try{
      const data = await getJSON(`${API}/destinations`);
      destinations = (data.destinations||[]).filter(d => /disney|universal/i.test(d.name));
      renderChips();
    }catch(err){
      document.getElementById("disneyChips").innerHTML = errorBox("無法讀取樂園清單，請確認網路連線後重試。", loadDestinations);
    }
  }

  function errorBox(msg, retryFn){
    const id = "retry_"+Math.random().toString(36).slice(2);
    setTimeout(()=>{
      const btn = document.getElementById(id);
      if(btn) btn.onclick = retryFn;
    },0);
    return `<div class="error-box">${msg}<br><button class="retry-btn" id="${id}">重試</button></div>`;
  }

  // Normalize for matching: lowercase, strip spaces/punctuation so "walt disney world"
  // and "waltdisneyworld" both match, and Chinese text is left untouched.
  function norm(s){ return (s||"").toLowerCase().replace(/[\s'’.,-]/g,""); }

  function destMatchesFilter(d, f){
    if(!f) return true;
    if(norm(d.name).includes(f)) return true;
    if(norm(zhName(d.name, destNameMap)).includes(f)) return true;
    return (d.parks||[]).some(p=>parkMatchesFilter(p, f));
  }
  function parkMatchesFilter(p, f){
    if(!f) return true;
    return norm(p.name).includes(f) || norm(zhName(p.name, parkNameMap)).includes(f);
  }

  function renderChips(filter=""){
    const f = norm(filter);
    const disney = destinations.filter(d=>/disney/i.test(d.name));
    const universal = destinations.filter(d=>/universal/i.test(d.name));
    const dEl = document.getElementById("disneyChips");
    const uEl = document.getElementById("universalChips");
    dEl.innerHTML = disney.filter(d=>destMatchesFilter(d,f)).map(chipHTML).join("") || `<div class="empty" style="padding:6px;">無符合結果</div>`;
    uEl.innerHTML = universal.filter(d=>destMatchesFilter(d,f)).map(chipHTML).join("") || `<div class="empty" style="padding:6px;">無符合結果</div>`;
    document.querySelectorAll(".chip").forEach(c=>{
      c.onclick = () => selectDestination(c.dataset.id);
    });
    renderQuickResults(f);
    document.getElementById("destSearchClear").style.display = filter ? "block" : "none";
  }
  function chipHTML(d){
    const active = currentDest && currentDest.id===d.id ? "active":"";
    return `<button class="chip ${active}" data-id="${d.id}">${zhName(d.name, destNameMap)}</button>`;
  }

  // Quick-jump results: match at the individual park level (e.g. typing "epcot" or
  // "海洋" jumps straight into that park instead of only filtering the resort chips).
  function renderQuickResults(f){
    const box = document.getElementById("quickResults");
    if(!f){ box.innerHTML = ""; return; }
    const hits = [];
    destinations.forEach(d=>{
      (d.parks||[]).forEach(p=>{
        if(parkMatchesFilter(p, f)) hits.push({dest:d, park:p});
      });
    });
    if(hits.length===0){ box.innerHTML = ""; return; }
    box.innerHTML = `<div class="quick-results">` + hits.slice(0,8).map(h=>`
      <button class="quick-item" data-dest="${h.dest.id}" data-park="${h.park.id}">
        <span>
          <span class="qi-name">${zhName(h.park.name, parkNameMap)}</span>
          <span class="qi-sub">${zhName(h.dest.name, destNameMap)}</span>
        </span>
        <span class="qi-go">前往 →</span>
      </button>
    `).join("") + `</div>`;
    box.querySelectorAll(".quick-item").forEach(btn=>{
      btn.onclick = ()=> selectDestination(btn.dataset.dest, btn.dataset.park);
    });
  }

  // Debounce search input so filtering doesn't run on every keystroke while typing.
  let searchDebounce = null;
  document.getElementById("destSearch").addEventListener("input", e=>{
    const val = e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>renderChips(val), 150);
  });
  document.getElementById("destSearchClear").addEventListener("click", ()=>{
    const box = document.getElementById("destSearch");
    box.value = "";
    box.focus();
    renderChips("");
  });

  function selectDestination(id, jumpParkId){
    currentDest = destinations.find(d=>d.id===id);
    renderChips(document.getElementById("destSearch").value);
    document.getElementById("parkTabsWrap").scrollIntoView({behavior:"smooth", block:"start"});
    loadParksForDestination(currentDest, jumpParkId);
  }

  function isParkType(entityType){
    return !!entityType && entityType.toUpperCase() === "PARK";
  }

  async function loadParksForDestination(dest, jumpParkId){
    const tabsWrap = document.getElementById("parkTabsWrap");
    const tabs = document.getElementById("parkTabs");
    tabsWrap.style.display = "block";
    tabs.innerHTML = "";
    document.getElementById("parkContent").innerHTML = `<div class="loading"><div class="spinner"></div>正在讀取「${zhName(dest.name, destNameMap)}」的樂園清單…</div>`;

    let parks = dest.parks || [];

    // Fallback: some destinations don't list parks in /destinations, but the same
    // data is always available by walking the destination's own children entity.
    // (Here entityType is reliably present, so it's safe to filter on it.)
    if(parks.length === 0){
      try{
        const data = await getJSON(`${API}/entity/${dest.id}/children`);
        parks = (data.children || []).filter(p => isParkType(p.entityType));
      }catch(err){
        parks = [];
      }
    }

    if(parks.length === 0){
      tabsWrap.style.display = "none";
      document.getElementById("parkContent").innerHTML = `<div class="empty">此度假區暫無獨立樂園資料，可能是資料來源尚未提供。<br><button class="retry-btn" id="retryParks">重試</button></div>`;
      document.getElementById("retryParks").onclick = () => loadParksForDestination(dest, jumpParkId);
      return;
    }

    tabs.innerHTML = parks.map(p=>`<button class="park-tab" data-id="${p.id}">${zhName(p.name, parkNameMap)}</button>`).join("");
    tabs.querySelectorAll(".park-tab").forEach(b=> b.onclick = ()=>selectPark(parks.find(p=>p.id===b.dataset.id), b));
    const target = (jumpParkId && parks.find(p=>p.id===jumpParkId)) || parks[0];
    const targetBtn = tabs.querySelector(`[data-id="${target.id}"]`) || tabs.querySelector(".park-tab");
    selectPark(target, targetBtn);
  }

  async function selectPark(park, btnEl){
    currentPark = park;
    document.querySelectorAll(".park-tab").forEach(b=>b.classList.remove("active"));
    if(btnEl) btnEl.classList.add("active");
    prevWaits = {};
    if(refreshTimer) clearInterval(refreshTimer);
    if(leafletMap){ leafletMap.remove(); leafletMap = null; }
    leafletMapParkId = null; leafletMarkers = {}; userMarker = null; routeLine = null;
    await renderParkShell();
    await Promise.all([loadSchedule(), loadChildren(), loadLive()]);
    refreshTimer = setInterval(loadLive, 120000);
  }

  function renderParkShell(){
    document.getElementById("parkContent").innerHTML = `
      <div class="stub" id="stub">
        <div class="loading"><div class="spinner"></div>正在讀取「${zhName(currentPark.name, parkNameMap)}」資料…</div>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="viewListBtn">📋 遊樂設施清單</button>
        <button class="view-btn" id="viewMapBtn">🗺️ 園區示意地圖</button>
      </div>
      <div id="viewArea"></div>
    `;
    currentView = "list";
    document.getElementById("viewListBtn").onclick = ()=>switchView("list");
    document.getElementById("viewMapBtn").onclick = ()=>switchView("map");

  function switchView(v){
    currentView = v;
    document.getElementById("viewListBtn").classList.toggle("active", v==="list");
    document.getElementById("viewMapBtn").classList.toggle("active", v==="map");

  // ---- Schedule ----
  async function loadSchedule(){
    try{
      const data = await getJSON(`${API}/entity/${currentPark.id}/schedule`);
      const list = data.schedule || [];
      const todayLocal = list.length ? list[0].date : null;
      let today = list.find(s=>s.date===todayLocal && s.type==="OPERATING") || list.find(s=>s.type==="OPERATING") || list[0];
      renderStub(today);
    }catch(err){
      document.getElementById("stub").innerHTML = `<h2>${zhName(currentPark.name, parkNameMap)}</h2><div class="item-status-text" style="margin-top:8px;">⚠️ 無法讀取營業時間資料</div>`;
    }
  }

  function renderStub(sched){
    const hasHours = sched && sched.openingTime && sched.closingTime;
    const statusKey = hasHours ? "OPERATING" : "CLOSED";
    document.getElementById("stub").innerHTML = `
      <div class="stub-top">
        <h2>${zhName(currentPark.name, parkNameMap)}</h2>
        <span class="status-pill status-${statusKey}">${hasHours ? "今日營業" : "今日無營業資訊"}</span>
      </div>

      <div class="hours-board">

          <div class="hours-time">${isoTime(sched.openingTime)}</div>
          <div class="hours-label">開園</div>

      </div>` : `<div class="item-status-text" style="margin-top:10px;">此樂園今日可能休園，或資料尚未提供。</div>`}

  // ---- Children (for map coordinates & entity metadata) ----
  async function loadChildren(){
    try{

  // ---- Live data ----
  async function loadLive(){
    try{
      const data = await getJSON(`${API}/entity/${currentPark.id}/live`);
      const newMap = {};
      (data.liveData||[]).forEach(e=>{ newMap[e.id] = e; });
      liveMap = newMap;
      renderViewArea();
      updateRefreshBar(true);
    }catch(err){
      if(!document.getElementById("viewArea").innerHTML){
        document.getElementById("viewArea").innerHTML = errorBox("無法讀取即時排隊與營運狀態資料。", loadLive);

  function updateRefreshBar(ok){
    let bar = document.getElementById("refreshBar");
    const now = new Date().toLocaleTimeString('zh-TW',{hour12:false});
    const html = `<span>${ok?"✅":"⚠️"} 最後更新 ${now}｜每 2 分鐘自動刷新</span><button class="refresh-btn" id="manualRefresh">立即刷新</button>`;
    if(!bar){
      const viewArea = document.getElementById("viewArea");
      viewArea.insertAdjacentHTML("afterend", `<div class="refresh-bar" id="refreshBar">${html}</div>`);
    } else {
      bar.innerHTML = html;
    }
    const btn = document.getElementById("manualRefresh");
    if(btn) btn.onclick = loadLive;
  }

  function classify(entry){
    if(!entry) return "other";
    if(entry.showtimes && entry.showtimes.length) return "show";
    const type = (entry.entityType || "").toUpperCase();
    // Explicitly exclude the few categories that are clearly not rides.
    if(["RESTAURANT","DINING","MERCHANDISE","SHOP","HOTEL"].includes(type)) return "other";
    if(entry.queue && Object.keys(entry.queue).length) return "attraction";
    if(type === "ATTRACTION") return "attraction";
    // Default to "attraction" for anything else carrying live status data, rather than
    // silently dropping it — under-inclusion is what caused rides like Epic Universe's
    // newer attractions to go missing when their entityType/queue shape didn't match
    // the exact string we expected.
    if(entry.status) return "attraction";
    return "other";
  }

  function renderViewArea(){
    const area = document.getElementById("viewArea");
    const entries = Object.values(liveMap);
    if(entries.length===0){
      area.innerHTML = `<div class="loading"><div class="spinner"></div>正在讀取即時資料…</div>`;
      return;
    }
    if(currentView==="list"){
      renderListView(area, entries);
    } else {
      if(!leafletMap || leafletMapParkId !== currentPark.id){
        renderMapView(area, entries);
      } else {
        updateMapMarkers(entries);
      }
    }
  }

  function renderListView(area, entries){
    let attractions = entries.filter(e=>classify(e)==="attraction");
    let shows = entries.filter(e=>classify(e)==="show");
    let others = entries.filter(e=>classify(e)==="other");

    const f = filterText.trim().toLowerCase();
    if(f){
      const matches = e => e.name.toLowerCase().includes(f) || (attrZh(e.name)||"").toLowerCase().includes(f);
      attractions = attractions.filter(matches);
      shows = shows.filter(matches);
      others = others.filter(matches);
    }
    if(sortMode==="wait"){
      attractions.sort((a,b)=>(waitVal(b)??-1)-(waitVal(a)??-1));
    } else {
      attractions.sort((a,b)=>a.name.localeCompare(b.name));
    }
    shows.sort((a,b)=>a.name.localeCompare(b.name));
    others.sort((a,b)=>a.name.localeCompare(b.name));

    area.innerHTML = `
      <div class="controls-row">
        <input class="searchbox" id="itemSearch" placeholder="搜尋設施或演出名稱…" value="${filterText.replace(/"/g,'&quot;')}"/>
        <button class="sort-btn" id="sortBtn">${sortMode==="wait" ? "⏱ 依等待時間" : "🔤 依名稱排序"}</button>
      </div>
      <div class="lang-toggle" id="langToggle">
        <span class="lang-label">名稱語言</span>
        <button class="lang-btn ${nameLangMode==='zh'?'active':''}" data-mode="zh">中文</button>
        <button class="lang-btn ${nameLangMode==='en'?'active':''}" data-mode="en">English</button>
        <button class="lang-btn ${nameLangMode==='both'?'active':''}" data-mode="both">中英對照</button>
      </div>
      <div class="section-title"><h3>🎢 遊樂設施</h3><span class="section-count">${attractions.length} 項</span></div>
      <div class="card-list" id="attrList">${attractions.map(attractionRow).join("") || emptyRow("目前沒有符合的遊樂設施")}</div>
      <div class="section-title"><h3>🎭 表演節目</h3><span class="section-count">${shows.length} 項</span></div>
      <div class="card-list" id="showList">${shows.map(showRow).join("") || emptyRow("目前沒有符合的演出資訊")}</div>
      ${others.length ? `
      <div class="section-title"><h3>❔ 其他未分類項目</h3><span class="section-count">${others.length} 項</span></div>
      <div class="map-note" style="margin:-2px 0 8px;">這些項目資料型別無法明確判斷是設施還是餐廳／商店，先列在這裡。如果看到漏掉的遊樂設施在這裡，跟我說一聲我就把它移到「遊樂設施」分類。</div>
      <div class="card-list" id="otherList">${others.map(otherRow).join("")}</div>
      ` : ``}
    `;
    document.getElementById("itemSearch").addEventListener("input", e=>{ filterText=e.target.value; renderViewArea(); });
    document.getElementById("sortBtn").onclick = ()=>{ sortMode = sortMode==="wait" ? "default" : "wait"; renderViewArea(); };
    document.getElementById("langToggle").querySelectorAll(".lang-btn").forEach(b=>{
      b.onclick = ()=>{ nameLangMode = b.dataset.mode; renderViewArea(); };
    });

    // flip animation for changed wait times
    attractions.forEach(e=>{
      const v = waitVal(e);
      const el = document.getElementById("flap_"+e.id);
      if(el && prevWaits[e.id]!==undefined && prevWaits[e.id]!==v){
        el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
      }
      prevWaits[e.id] = v;
    });
  }

  function otherRow(e){
    const status = e.status || "unknown";
    return `
      <div class="item-row" id="row_${e.id}">
        <div class="item-main">
          <div class="item-name" id="name_${e.id}">${displayAttrName(e.name, e.id)}</div>
          <div class="item-meta"><span class="dot dot-${status}"></span><span class="item-status-text">類型：${e.entityType||"未知"}</span></div>
        </div>
      </div>
    `;
  }

  function emptyRow(msg){ return `<div class="empty">${msg}</div>`; }

  function waitVal(e){
    const q = e && e.queue;
    if(!q) return null;
    const standby = q.STANDBY || q.standby;
    return (standby && typeof standby.waitTime === "number") ? standby.waitTime : null;
  }

  function attractionRow(e){
    const status = e.status || "unknown";
    const wait = waitVal(e);
    const waitDisplay = status!=="OPERATING" ? "—" : (wait===null ? "--" : wait);
    return `
      <div class="item-row" id="row_${e.id}">
        <div class="item-main">
          <div class="item-name" id="name_${e.id}">${displayAttrName(e.name, e.id)}</div>
          <div class="item-meta"><span class="dot dot-${status}"></span><span class="item-status-text">${statusZh[status]||status}</span></div>
        </div>
        <div class="flap" id="flap_${e.id}">${waitDisplay}<span class="flap-sub">${status==="OPERATING" ? "分鐘" : ""}</span></div>
      </div>
    `;
  }

  function showRow(e){
    const status = e.status || "unknown";
    const times = (e.showtimes||[]).slice(0,4).map(s=>`<span class="showtime-chip">${isoTime(s.startTime)}</span>`).join("");
    return `
      <div class="item-row" id="row_${e.id}">
        <div class="item-main">
          <div class="item-name" id="name_${e.id}">${displayAttrName(e.name, e.id)}</div>
          <div class="item-meta"><span class="dot dot-${status}"></span><span class="item-status-text">${statusZh[status]||status}</span></div>
        </div>
        <div class="showtimes">${times || '<span class="item-status-text">今日無場次</span>'}</div>
      </div>
    `;
  }

  // ---- Map view: real OpenStreetMap tiles via Leaflet, live "you are here" GPS dot,
  // and on-demand walking directions (OSRM) to a chosen attraction. ----
  function statusColor(status){
    return status==="OPERATING" ? "#2F6B4F" : status==="DOWN" ? "#B23A2E" : status==="REFURBISHMENT" ? "#C97A22" : "#8A8570";
  }

  function markerPopupHTML(e){
    const status = e.status || "unknown";
    const wait = waitVal(e);
    const kind = classify(e);
    let detail;
    if(kind==="show"){
      const times = (e.showtimes||[]).slice(0,3).map(s=>isoTime(s.startTime)).join("、");
      detail = times ? `今日場次：${times}` : "今日無場次資訊";
    } else {
      detail = status==="OPERATING" ? `等待時間：約 ${wait===null?"--":wait} 分鐘` : (statusZh[status]||status);
    }
    return `
      <div class="popup-title">${displayAttrName(e.name, e.id).replace(/<span class="name-en">.*?<\/span>/,"")}</div>
      <div>${detail}</div>
      <div class="popup-btn-row">
        <button class="popup-btn" onclick="window.__parkApp.routeTo('${e.id}')">🧭 走路路線</button>
        <button class="popup-btn" onclick="window.__parkApp.showInList('${e.id}')">📋 清單定位</button>
      </div>
    `;
  }

  function renderMapView(area, entries){
    const points = entries
      .map(e=>({e, loc: childrenMap[e.id]?.location}))
      .filter(p=>p.loc && typeof p.loc.latitude==="number" && typeof p.loc.longitude==="number");

    if(typeof L === "undefined"){
      area.innerHTML = `<div class="map-wrap"><div class="empty">地圖元件載入失敗，請檢查網路連線後重新整理頁面。</div></div>`;
      return;
    }
    if(points.length < 3){
      area.innerHTML = `<div class="map-wrap"><div class="empty">此樂園目前沒有足夠的座標資料，暫時無法顯示地圖。可切換回清單檢視即時等待時間。</div></div>`;
      leafletMap = null; leafletMapParkId = null;
      return;
    }

    area.innerHTML = `
      <div class="map-wrap">
        <div class="map-note">真實地圖（OpenStreetMap 圖資）。●為遊樂設施、▲為演出節目，顏色代表目前狀態。點圖示可查看等待時間，或規劃從您目前位置步行過去的路線。</div>
        <div id="leafletMap"></div>
        <div class="map-controls">
          <button class="map-ctrl-btn" id="locateBtn">📍 定位我的位置</button>
          <button class="map-ctrl-btn" id="clearRouteBtn">✕ 清除路線</button>
        </div>
        <div class="route-info" id="routeInfo"></div>
        <div class="legend">
          <div class="legend-item"><span class="legend-swatch" style="background:var(--green)"></span>營運中</div>
          <div class="legend-item"><span class="legend-swatch" style="background:var(--red)"></span>暫停服務</div>
          <div class="legend-item"><span class="legend-swatch" style="background:var(--amber)"></span>整修中</div>
          <div class="legend-item"><span class="legend-swatch" style="background:var(--gray)"></span>休園／未知</div>
        </div>
      </div>
    `;

    if(leafletMap){ leafletMap.remove(); }
    leafletMarkers = {}; userMarker = null; routeLine = null;
    leafletMapParkId = currentPark.id;

    const lats = points.map(p=>p.loc.latitude), lngs = points.map(p=>p.loc.longitude);
    const center = [ (Math.min(...lats)+Math.max(...lats))/2, (Math.min(...lngs)+Math.max(...lngs))/2 ];

    leafletMap = L.map('leafletMap', {zoomControl:true}).setView(center, 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
    }).addTo(leafletMap);

    const boundsPts = [];
    points.forEach(p=>{
      const kind = classify(p.e);
      const status = p.e.status || "unknown";
      const color = statusColor(status);
      const latlng = [p.loc.latitude, p.loc.longitude];
      boundsPts.push(latlng);
      let marker;
      if(kind==="show"){
        marker = L.marker(latlng, {
          icon: L.divIcon({className:'', html:`<div style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid ${color};filter:drop-shadow(0 0 1px #fff);"></div>`, iconSize:[14,12], iconAnchor:[7,10]})
        });
      } else {
        marker = L.circleMarker(latlng, {radius:7, color:'#fff', weight:1.5, fillColor:color, fillOpacity:.95});
      }
      marker.bindPopup(markerPopupHTML(p.e));
      marker.addTo(leafletMap);
      leafletMarkers[p.e.id] = marker;
    });
    if(boundsPts.length){ leafletMap.fitBounds(boundsPts, {padding:[30,30]}); }

    document.getElementById("locateBtn").onclick = locateMe;
    document.getElementById("clearRouteBtn").onclick = clearRoute;

    if(userLatLng){ addOrMoveUserMarker(); }
  }

  function updateMapMarkers(entries){
    entries.forEach(e=>{
      const marker = leafletMarkers[e.id];
      if(!marker) return;
      const status = e.status || "unknown";
      const color = statusColor(status);
      if(marker.setStyle) marker.setStyle({fillColor:color, color:'#fff'});
      marker.setPopupContent(markerPopupHTML(e));
    });
  }

  function addOrMoveUserMarker(){
    if(!leafletMap || !userLatLng) return;
    if(userMarker){
      userMarker.setLatLng(userLatLng);
    } else {
      userMarker = L.marker(userLatLng, {
        icon: L.divIcon({className:'', html:'<div class="you-are-here-dot"></div>', iconSize:[16,16], iconAnchor:[8,8]})
      }).addTo(leafletMap).bindPopup("您目前的位置");
    }
  }

  function locateMe(){
    if(!navigator.geolocation){
      alert("此瀏覽器不支援定位功能。");
      return;
    }
    const btn = document.getElementById("locateBtn");
    if(btn) btn.textContent = "📍 定位中…";
    navigator.geolocation.getCurrentPosition(pos=>{
      userLatLng = [pos.coords.latitude, pos.coords.longitude];
      addOrMoveUserMarker();
      if(leafletMap) leafletMap.setView(userLatLng, 18);
      if(btn) btn.textContent = "📍 定位我的位置";
    }, err=>{
      if(btn) btn.textContent = "📍 定位我的位置";
      alert("無法取得您的位置，請確認瀏覽器已允許使用定位功能。");
    }, {enableHighAccuracy:true, timeout:10000});
  }

  function routeToAttraction(id){
    if(!userLatLng){
      if(!navigator.geolocation){ alert("此瀏覽器不支援定位功能，無法規劃路線。"); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        userLatLng = [pos.coords.latitude, pos.coords.longitude];
        addOrMoveUserMarker();
        fetchRoute(id);
      }, ()=>{ alert("需要先允許定位，才能規劃前往此設施的步行路線。"); });
    } else {
      fetchRoute(id);
    }
  }

  function fetchRoute(id){
    const marker = leafletMarkers[id];
    const info = document.getElementById("routeInfo");
    if(!marker || !leafletMap) return;
    if(info) info.textContent = "規劃路線中…";
    const dest = marker.getLatLng();
    const url = `https://router.project-osrm.org/route/v1/foot/${userLatLng[1]},${userLatLng[0]};${dest.lng},${dest.lat}?overview=full&geometries=geojson`;
    fetch(url).then(r=>r.json()).then(data=>{
      if(!data.routes || !data.routes[0]) throw new Error("no route");
      const route = data.routes[0];
      const coords = route.geometry.coordinates.map(c=>[c[1],c[0]]);
      if(routeLine) leafletMap.removeLayer(routeLine);
      routeLine = L.polyline(coords, {color:'#1a73e8', weight:5, opacity:.85}).addTo(leafletMap);
      leafletMap.fitBounds(routeLine.getBounds(), {padding:[40,40]});
      const mins = Math.round(route.duration/60);
      const meters = Math.round(route.distance);
      if(info) info.innerHTML = `🚶 步行約 ${mins} 分鐘（約 ${meters} 公尺）。路線依 OpenStreetMap 步道資料計算，僅供參考，實際園區動線請以現場指示為準。`;
    }).catch(()=>{
      if(info) info.innerHTML = `⚠️ 無法取得路線，可能是此區域的步道資料尚不完整。`;
    });
  }

  function clearRoute(){
    if(routeLine && leafletMap){ leafletMap.removeLayer(routeLine); routeLine = null; }
    const info = document.getElementById("routeInfo");
    if(info) info.textContent = "";
  }

  function showInList(id){
    switchView("list");
    setTimeout(()=>{
      const row = document.getElementById("row_"+id);
      if(row){
        row.scrollIntoView({behavior:"smooth", block:"center"});
        row.classList.add("highlight");
        setTimeout(()=>row.classList.remove("highlight"), 1800);
      }
    }, 50);
  }

  // Leaflet popup buttons are parsed as plain HTML strings, so they need a global hook.
  window.__parkApp = { routeTo: routeToAttraction, showInList: showInList };

  loadDestinations();
})();
</script>
</body>
</html>
